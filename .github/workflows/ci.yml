name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject.toml promises (requires-python
        # >= 3.10); .python-version pins what development uses day to day.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create the environment
        # Mirrors the workflow documented in CONTRIBUTING.md.
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv pip install -r requirements-dev.txt

      - name: Lint and format the ChipZen port
        run: |
          uv run --no-project ruff check --isolated bots/chipzen/bot.py sleight_of_hand/holdem scripts/build_chipzen.py scripts/generate_preflop_tables.py scripts/preflop_calibration.py tests/test_chipzen.py tests/test_preflop.py
          uv run --no-project ruff format --isolated --check bots/chipzen/bot.py sleight_of_hand/holdem scripts/build_chipzen.py scripts/generate_preflop_tables.py scripts/preflop_calibration.py tests/test_chipzen.py tests/test_preflop.py

      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -q

      - name: Predict ChipZen preflop frequencies
        run: uv run --no-project python scripts/preflop_calibration.py

      - name: Stage and validate the ChipZen runtime
        run: |
          uv run --no-project python scripts/build_chipzen.py
          uv run --no-project chipzen-sdk validate build/chipzen --check-connectivity

      - name: Smoke-test the entry points
        run: |
          uv run --no-project python demo.py --hands 2 --seed 1
          uv run --no-project python demo.py --gamemode leduc --hands 1 --seed 2

      - name: Reserved gamemodes fail with a message, not a traceback
        run: |
          if uv run --no-project python demo.py --gamemode deuce27 2>&1 | tee /dev/stderr | grep -q Traceback; then
            echo "::error::--gamemode deuce27 raised instead of exiting cleanly"
            exit 1
          fi
