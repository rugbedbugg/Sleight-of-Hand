name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range pyproject.toml promises (requires-python
        # >= 3.10); .python-version pins what development uses day to day.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The extraction regression compares against the immutable oracle.
          fetch-depth: 0

      - name: Install the matrix Python with mise
        # CI-only mise.toml (not committed) selects the matrix interpreter;
        # it takes precedence over .python-version, which stays the
        # developer's day-to-day pin.
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.12
          mise_toml: |
            [tools]
            python = "${{ matrix.python-version }}"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Create the environment from the committed lock
        # --locked fails if pyproject.toml and uv.lock disagree instead of
        # re-resolving, so CI can never update the lock. The matrix
        # interpreter comes from mise; uv must not download another.
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --python "$(mise which python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Confirm the matrix interpreter
        run: |
          python --version
          command -v python ruff chipzen-sdk
          python - <<'PY'
          import sys
          want = "${{ matrix.python-version }}"
          got = f"{sys.version_info.major}.{sys.version_info.minor}"
          assert got == want, f"running Python {got}, matrix asked for {want}"
          assert sys.prefix.endswith("/.venv"), f"not the job venv: {sys.prefix}"
          PY

      - name: Lint and format the ChipZen port
        run: |
          ruff check --isolated bots/chipzen/bot.py sleight_of_hand/holdem scripts/build_chipzen.py scripts/generate_preflop_tables.py scripts/preflop_calibration.py scripts/audit_preflop.py scripts/shove_adaptation_report.py scripts/build_opponent_priors.py tests/test_chipzen.py tests/test_preflop.py tests/test_preflop_gate.py tests/test_shove_model.py tests/test_opponent_memory.py tests/test_opponent_memory_parity.py tests/test_opponent_profiles.py sleight_of_hand/experiments scripts/run_experiment.py scripts/run_experiment_batch.py scripts/analyze_experiment.py scripts/build_local_prior.py tests/test_experiment_spec.py tests/test_experiment_journal.py tests/test_experiment_local_platform.py tests/test_experiment_metrics.py tests/test_experiment_scheduler.py tests/test_experiment_chipzen.py tests/test_experiment_firewall.py tests/test_dependencies.py tests/test_experiment_supervisor.py tests/test_experiment_optimizer.py
          ruff format --isolated --check bots/chipzen/bot.py sleight_of_hand/holdem scripts/build_chipzen.py scripts/generate_preflop_tables.py scripts/preflop_calibration.py scripts/audit_preflop.py scripts/shove_adaptation_report.py scripts/build_opponent_priors.py tests/test_chipzen.py tests/test_preflop.py tests/test_preflop_gate.py tests/test_shove_model.py tests/test_opponent_memory.py tests/test_opponent_memory_parity.py tests/test_opponent_profiles.py sleight_of_hand/experiments scripts/run_experiment.py scripts/run_experiment_batch.py scripts/analyze_experiment.py scripts/build_local_prior.py tests/test_experiment_spec.py tests/test_experiment_journal.py tests/test_experiment_local_platform.py tests/test_experiment_metrics.py tests/test_experiment_scheduler.py tests/test_experiment_chipzen.py tests/test_experiment_firewall.py tests/test_dependencies.py tests/test_experiment_supervisor.py tests/test_experiment_optimizer.py

      - name: Check the installed research CLI
        run: |
          uv run --locked --python "$PWD/.venv/bin/python" research --help
          uv run --locked --python "$PWD/.venv/bin/python" research status --json
          uv run --locked --python "$PWD/.venv/bin/python" research plan --json

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Predict ChipZen preflop frequencies
        run: |
          python scripts/preflop_calibration.py
          python scripts/audit_preflop.py --policy
          python scripts/shove_adaptation_report.py

      - name: Stage and validate the ChipZen runtime
        run: |
          python scripts/build_chipzen.py
          chipzen-sdk validate build/chipzen --check-connectivity

      - name: Smoke-test the entry points
        run: |
          python demo.py --hands 2 --seed 1
          python demo.py --gamemode leduc --hands 1 --seed 2

      - name: Reserved gamemodes fail with a message, not a traceback
        run: |
          if python demo.py --gamemode deuce27 2>&1 | tee /dev/stderr | grep -q Traceback; then
            echo "::error::--gamemode deuce27 raised instead of exiting cleanly"
            exit 1
          fi

      - name: The lock and the checkout are unchanged
        # mise-action writes the CI-only mise.toml above; nothing else may appear.
        run: |
          git diff --exit-code -- uv.lock
          changes="$(git status --porcelain -- . ':(exclude)mise.toml')"
          test -z "$changes" || { echo "$changes"; exit 1; }
